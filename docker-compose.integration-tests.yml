services:
  postgres-test:
    image: postgres:16-alpine
    container_name: postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-notifications_test}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-postgres} -d ${POSTGRES_TEST_DB:-notifications_test}"]
      interval: 10s
      timeout: 5s
      retries: 5

  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.integration-tests
    container_name: notifications_integration_tests
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres-test;Port=5432;Database=${POSTGRES_TEST_DB:-notifications_test};Username=${POSTGRES_TEST_USER:-postgres};Password=${POSTGRES_TEST_PASSWORD:-postgres}"
    depends_on:
      postgres-test:
        condition: service_healthy