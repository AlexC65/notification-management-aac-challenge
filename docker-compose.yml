services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notifications_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-NotificationManagement.API}
      Jwt__Audience: ${JWT_AUDIENCE:-NotificationManagement.API}
      Jwt__ExpirationHours: ${JWT_EXPIRATION_HOURS:-1}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    container_name: postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
      image: postgres:16-alpine
      container_name: postgres_test
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${POSTGRES_TEST_USER:-postgres}
        POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-postgres}
        POSTGRES_DB: ${POSTGRES_TEST_DB:-notifications_test}
      ports:
        - "5433:5432"
      # No named volume on purpose: test data should be disposable,
      # recreated fresh (migrations) each test run.
      tmpfs:
        - /var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-postgres} -d ${POSTGRES_TEST_DB:-notifications_test}"]
        interval: 10s
        timeout: 5s
        retries: 5

volumes:
  postgres_data: