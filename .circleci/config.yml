version: 2.1

jobs:
  build-and-test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:9.0
      - image: postgres:16-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notifications_test
    working_directory: ~/repo
    environment:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=notifications_test;Username=postgres;Password=postgres"
      Jwt__Secret: "test-secret-key-for-ci-only-not-for-production-use"
      Jwt__Issuer: "NotificationManagement.API"
      Jwt__Audience: "NotificationManagement.API"
      Jwt__ExpirationHours: "1"
    steps:
      - checkout

      - restore_cache:
          keys:
            - dotnet-packages-{{ checksum "NotificationManagement.sln" }}

      - run:
          name: Restore dependencies
          command: dotnet restore NotificationManagement.sln

      - save_cache:
          paths:
            - ~/.nuget/packages
          key: dotnet-packages-{{ checksum "NotificationManagement.sln" }}

      - run:
          name: Install PostgreSQL client
          command: apt-get update && apt-get install -y postgresql-client

      - run:
          name: Wait for PostgreSQL to be ready
          command: |
            until pg_isready -h localhost -p 5432 -U postgres; do
              echo "Waiting for PostgreSQL..."
              sleep 1
            done
            echo "PostgreSQL is ready!"

      - run:
          name: Build
          command: dotnet build NotificationManagement.sln --configuration Release --no-restore

      - run:
          name: Install dotnet-ef tool
          command: dotnet tool install --global dotnet-ef

      - run:
          name: Apply EF Core migrations
          command: |
            export PATH="$PATH:/root/.dotnet/tools"
            dotnet ef database update \
              --project src/NotificationManagement.Infrastructure/NotificationManagement.Infrastructure.csproj \
              --startup-project src/NotificationManagement.API/NotificationManagement.API.csproj

      - run:
          name: Run tests with coverage
          command: |
            dotnet test NotificationManagement.sln --configuration Release --no-build \
              --collect:"XPlat Code Coverage" \
              --results-directory ./coverage \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=lcov

      - run:
          name: Locate and rename coverage file
          command: |
            find ./coverage -name "coverage.info" -exec cp {} ./coverage/lcov.info \;

      - run:
          name: Upload coverage to Coveralls
          command: |
            curl -L https://coveralls.io/coveralls-linux.tar.gz | tar -xz
            ./coveralls report ./coverage/lcov.info \
              --repo-token=$COVERALLS_REPO_TOKEN \
              --format=lcov

workflows:
  build-and-test-workflow:
    jobs:
      - build-and-test